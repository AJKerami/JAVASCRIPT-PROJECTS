<!-- ajax_basic.html: a small demonstration of an XMLHttpRequest. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basic AJAX Demo</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="main">
      <h1>Get the Latest Content</h1>

      <!-- AJAX replaces this container with the contents of content.html. -->
      <div class="content" id="content">
        <input
          type="button"
          class="button"
          value="Get Content"
          id="btn_content"
          onclick="getContent();"
        >
      </div>
    </main>

    <script>
      // STEP 1: create the XMLHttpRequest object used to request the file.
      var ajax = new XMLHttpRequest();

      // STEP 2: prepare a GET request for the local content.html document.
      ajax.open('GET', 'content.html');

      // STEP 3: update the page after the request has completed successfully.
      ajax.onreadystatechange = function () {
        if (ajax.readyState === 4 && ajax.status === 200) {
          document.getElementById('content').innerHTML = ajax.responseText;
        }
      };

      // STEP 4: send the request and hide the button after it has been used.
      function getContent() {
        ajax.send();
        document.getElementById('btn_content').style.display = 'none';
      }
    </script>
  </body>
</html>
