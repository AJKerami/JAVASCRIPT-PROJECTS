<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Switch Statement</title>
    <script src="JavaScript/JavaScript_1.js" defer></script>
</head>
<body>
    <h1>Choose an Animal</h1>
    <label for="Animal_Input">Animal:</label>
    <select id="Animal_Input">
        <option value="">Choose an animal</option>
        <option value="dog">Dog</option>
        <option value="cat">Cat</option>
        <option value="rabbit">Rabbit</option>
    </select>
    <button onclick="animal_Function()">Show animal sound</button>
    <p id="Animal_Output" aria-live="polite"></p>
</body>
</html>
