<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionaries</title>
    <script src="JS/main.js" defer></script>
</head>
<body>
    <h1>JavaScript Dictionary</h1>
    <button type="button" onclick="showDictionary()">Display a key-value pair</button>
    <p id="dictionary" aria-live="polite"></p>
    <button type="button" onclick="deleteDictionaryKey()">Delete a key, then display its value</button>
    <p id="deletedKey" aria-live="polite"></p>
    <button type="button" onclick="duplicateKey()">Try a duplicate key</button>
    <p id="duplicate" aria-live="polite"></p>
</body>
</html>
