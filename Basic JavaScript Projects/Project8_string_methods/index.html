<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 8 — String Methods</title>
  <script src="JS/main.js" defer></script>
</head>
<body>
  <h1>JavaScript String and Number Methods</h1>
  <p id="Concatenate" onclick="fullSentence()">Click to join several strings.</p>
  <p id="Slice"></p>
  <button type="button" onclick="sliceMethod()">Extract a name with slice()</button>
  <p>toUpperCase() returns a new string with the letters converted to uppercase.</p>
  <p>search() returns the index of the first regular-expression match, or -1 when no match exists.</p>
  <button type="button" onclick="moreMethods()">Run uppercase and search examples</button>
  <p id="Uppercase"></p>
  <p id="Search"></p>
  <button type="button" onclick="stringMethod()">Convert a number to a string</button>
  <p id="NumberToString"></p>
  <button type="button" onclick="precisionMethod()">Format to 10 significant digits</button>
  <p id="Precision"></p>
</body>
</html>
