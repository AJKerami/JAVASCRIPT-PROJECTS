<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops and Arrays</title>
    <script src="JS/main.js" defer></script>
</head>
<body>
    <h1>Loops and Arrays</h1>
    <h2>While Loop</h2>
    <p id="Loop"></p>
    <button onclick="Call_Loop()">Count to ten</button>
    <h2>String Length</h2>
    <label for="text">Enter text:</label>
    <input id="text" value="JavaScript">
    <button onclick="showLength()">Show length</button>
    <p id="Length"></p>
    <h2>For Loop</h2>
    <p id="List_of_Instruments"></p>
    <button onclick="for_Loop()">List instruments</button>
    <h2>Array Index</h2>
    <button onclick="showArrayExample()">Show the second color</button>
    <p id="Array" aria-live="polite"></p>
    <h2>Object Created with let</h2>
    <p id="Object_Details"></p>
    <button onclick="showObject()">Show vehicle details</button>
    <h2>Object Created with const</h2>
    <p>A const object can have its properties changed without being reassigned.</p>
    <button onclick="constant_initial_function()">Show original instrument</button>
    <button onclick="constant_function()">Show changed instrument</button>
    <p id="Constant" aria-live="polite"></p>
    <h2>Break and Continue</h2>
    <p>Break stops the whole loop before 5. Continue skips 5 and keeps counting.</p>
    <button onclick="showBreakLoop()">Stop before five</button>
    <p id="Break_Output" aria-live="polite"></p>
    <button onclick="showContinueLoop()">Skip five</button>
    <p id="Continue_Output" aria-live="polite"></p>
</body>
</html>
