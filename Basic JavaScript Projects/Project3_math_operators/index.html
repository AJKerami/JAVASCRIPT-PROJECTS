<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Operators</title>
    <script src="JS/main.js" defer></script>
</head>
<body>
    <h1>JavaScript Math Operators</h1>
    <p>Each button calls a function and displays its result.</p>
    <button type="button" onclick="addNumbers()">Add 15 + 5</button>
    <p id="addition" aria-live="polite"></p>
    <button type="button" onclick="subtractNumbers()">Subtract 15 - 5</button>
    <p id="subtraction" aria-live="polite"></p>
    <button type="button" onclick="multiplyNumbers()">Multiply 6 × 4</button>
    <p id="multiplication" aria-live="polite"></p>
    <button type="button" onclick="divideNumbers()">Divide 24 ÷ 6</button>
    <p id="division" aria-live="polite"></p>
    <button type="button" onclick="multipleOperations()">Calculate (2 + 3) × 4 ÷ 2 - 1</button>
    <p id="multiple" aria-live="polite"></p>
    <button type="button" onclick="remainder()">Remainder of 25 ÷ 6</button>
    <p id="modulus" aria-live="polite"></p>
    <button type="button" onclick="negateNumber()">Negate 10</button>
    <p id="negation" aria-live="polite"></p>
    <button type="button" onclick="incrementNumber()">Increment 5</button>
    <p id="increment" aria-live="polite"></p>
    <button type="button" onclick="decrementNumber()">Decrement 5</button>
    <p id="decrement" aria-live="polite"></p>
    <button type="button" onclick="randomNumber()">Random number from 0 to less than 1</button>
    <p id="random" aria-live="polite"></p>
    <button type="button" onclick="squareRoot()">Square root of 144</button>
    <p id="mathObject" aria-live="polite"></p>
</body>
</html>
